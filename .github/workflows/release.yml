name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write      # Pour créer tags + GitHub Releases
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                  # Très important pour semantic-release + GoReleaser

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm is resolved by corepack from the "packageManager" field in
      # web/package.json, so CI always uses the exact version pinned in the repo.
      # GoReleaser's before-hook builds the frontend, so pnpm must exist first.
      - name: Enable pnpm via corepack
        run: |
          corepack enable pnpm
          corepack pnpm --version
        working-directory: web

      # Login Docker Hub (pour GoReleaser si tu pushes des images)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pour builder des images multi-plateformes (amd64 et arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: "~> v2"

      # Lancement de semantic-release.
      # semantic-release et ses plugins sont fournis par `pnpm dlx` (plus de
      # `npm install -g` non épinglé) : les majeures sont figées ici, ce qui
      # évite qu'une version fraîchement publiée entre dans la release.
      - name: Run Semantic Release & GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          pnpm dlx \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            --package=@semantic-release/github@12 \
            --package=conventional-changelog-conventionalcommits@9 \
            semantic-release